name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: flake8 .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run with docker-compose
        run: |
          # Ensure your config/setup.sh runs 'docker-compose up -d'
          bash config/setup.sh
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for FastAPI server to be healthy..."
          timeout 300s bash -c \
            'until curl -f http://localhost:8000/health; do echo "Waiting for service..."; sleep 5; done'
          echo "FastAPI server is healthy!"
      - name: Check running containers
        run: docker-compose ps
      - name: Run integration tests
        run: |
          # Example: If you have Python integration tests that hit localhost:8000
          # pip install requests # If needed for your tests
          # python -m pytest tests/integration/ # Or your specific integration test command
          echo "Placeholder for integration tests. Replace with your actual test command."
      - name: Stop Docker Compose services
        if: always()
        run: |
          docker-compose down